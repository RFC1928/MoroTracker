services:
  moro:
    build:
      context: .
      dockerfile: Dockerfile
    # Loopback-only publish, in addition to the shared `proxy` network Caddy
    # uses (reverse_proxy moro:8787). Not exposed on the LAN interface — only
    # lets host processes on docker01 itself reach it, so `tailscale serve`
    # can proxy it onto the tailnet as a second, independent ingress path for
    # off-LAN access without touching Caddy/DNS at all.
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      proxy:
        aliases:
          - moro
    volumes:
      - data:/app/data
    # Streak/forgiveness logic is still all client-side, but /nag (the Uptime
    # Kuma don't-forget check) does server-side date math: it needs to know
    # what "today" and the 22:00 cutoff mean in the family's local time.
    environment:
      MORO_TZ: America/New_York
      MORO_NAG_CUTOFF: "22:00"
    restart: unless-stopped

networks:
  # The shared reverse-proxy network owned by the caddy stack. Created once on
  # the host (`docker network create proxy`); Compose refuses to start until it
  # exists, so the app can't come up detached from the proxy.
  proxy:
    external: true
    name: proxy

volumes:
  # The single moro-state.json lives in an EXTERNAL volume with a fixed name,
  # decoupled from the compose project/directory. Compose refuses to start if it
  # is missing rather than silently creating an empty one — so a deploy can never
  # wipe the shared tracking data. Create + seed it once (see DEPLOY.md):
  #   docker volume create moro_data
  data:
    external: true
    name: moro_data
